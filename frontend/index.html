<!DOCTYPE html>

  <head>

        <span class="brand-role">// AI_SOFTWARE_ENGINEER</span>

      <nav>
        <ul class="nav-links">
          <li><button class="nav-btn active" data-tab="about">[01 // ABOUT]</button></li>
          <li><button class="nav-btn" data-tab="projects">[02 // PROJECTS]</button></li>

          <li><button class="nav-btn" data-tab="experience">[04 // EXPERIENCE]</button></li>

            <a href="https://ganeshan.dev" target="_blank" class="cv-nav-btn" title="Download Ganeshan Arumuganainar CV">

            </a>
          </li>
          <li>
            <button class="assistant-toggle-btn" id="nav-assistant-btn">
              <span>&gt;_&lt;</span> AI_ASSISTANT
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Main Container -->

      <div id="terminal-window-container"></div>
    </main>

    <!-- Dockable Terminal AI Assistant Window -->
    <div id="chat-dock-container"></div>

    <!-- Application Script -->
    <script type="module" src="/src/main.ts"></script>
